<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM Maass Publicidad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="login" class="login hidden">
    <form id="login-form" class="card">
      <h1>CRM Maass</h1>
      <p class="muted">Leads de marketing y ventas</p>
      <label>Email <input type="email" name="email" required autocomplete="username"></label>
      <label>Contraseña <input type="password" name="password" required autocomplete="current-password"></label>
      <p id="login-error" class="error"></p>
      <button type="submit">Entrar</button>
    </form>
  </section>

  <section id="setup" class="login hidden">
    <form id="setup-form" class="card">
      <h1>Bienvenido</h1>
      <p class="muted">Crea tu usuario de gerente. Con él darás de alta al resto del equipo.</p>
      <label>Tu nombre <input name="name" required></label>
      <label>Email <input type="email" name="email" required autocomplete="username"></label>
      <label>Contraseña (mínimo 8 caracteres) <input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
      <fieldset class="plain operator-question">
        <legend>¿También harás las funciones de operador (capturar y asignar los leads a los vendedores)?</legend>
        <div class="seg-group">
          <label class="seg"><input type="radio" name="can_assign" value="1" required><span>Sí, somos un equipo chico</span></label>
          <label class="seg"><input type="radio" name="can_assign" value=""><span>No, habrá un operador</span></label>
        </div>
      </fieldset>
      <p id="setup-error" class="error"></p>
      <button type="submit">Crear y entrar</button>
    </form>
  </section>

  <section id="app" class="hidden">
    <header class="topbar">
      <strong class="brand">CRM Maass</strong>
      <nav id="nav">
        <button data-view="today" data-role="vendedor">Mi día</button>
        <button data-view="team" data-role="gerente,analista">Equipo hoy</button>
        <button data-view="board">Tablero</button>
        <button data-view="assign" data-assigner>Asignación</button>
        <button data-view="stats" data-role="gerente,marketing,vendedor,analista">Resumen</button>
        <button data-view="users" data-role="gerente">Usuarios</button>
        <button data-view="settings" data-role="gerente,marketing">Configuración</button>
      </nav>
      <span class="spacer"></span>
      <span id="me" class="muted"></span>
      <button id="logout" class="ghost">Salir</button>
    </header>

    <div class="page-head">
      <h1 id="page-title">Tablero</h1>
      <p id="page-sub" class="muted"></p>
    </div>

    <div class="toolbar">
      <input id="f-q" type="search" placeholder="Buscar nombre, teléfono, email, campaña" aria-label="Buscar">
      <select id="f-period" aria-label="Periodo">
        <option value="">Todo el tiempo</option><option value="mes">Este mes</option><option value="mes_pasado">Mes pasado</option>
        <option value="30">Últimos 30 días</option><option value="90">Últimos 90 días</option><option value="anio">Este año</option>
      </select>
      <select id="f-assigned" aria-label="Vendedor"><option value="">Todos los vendedores</option><option value="none">Sin asignar</option></select>
      <select id="f-campaign" aria-label="Campaña"><option value="">Todas las campañas</option></select>
      <button type="button" id="more-filters" class="ghost" aria-expanded="false" aria-controls="extra-filters">Más filtros</button>
      <span class="spacer"></span>
      <button id="export" class="ghost" data-role="gerente,marketing,analista">Exportar CSV</button>
      <button id="new-lead" data-role="gerente,marketing,vendedor,operador">+ Lead</button>
      <div id="extra-filters" class="extra-filters hidden">
        <select id="f-status" aria-label="Etapa"><option value="">Toda etapa</option></select>
        <select id="f-profile" aria-label="Perfil"><option value="">Todo perfil</option></select>
        <select id="f-source" aria-label="Origen"><option value="">Todo origen</option></select>
        <select id="f-product" aria-label="Producto"><option value="">Todo producto</option><option value="none">Sin producto</option></select>
        <select id="f-channel" aria-label="Canal"><option value="">Todo canal</option><option value="none">Sin dato de canal</option></select>
        <select id="f-reason" aria-label="Motivo"><option value="">Todo motivo</option></select>
        <button type="button" id="clear-filters" class="ghost small">Limpiar filtros</button>
      </div>
    </div>

    <main>
      <div id="board-alert" class="board-alert hidden" role="status"></div>
      <div id="view-today" class="view"></div>
      <div id="view-team" class="view"></div>
      <div id="view-board" class="board view"></div>
      <div id="view-assign" class="view"></div>
      <div id="view-stats" class="view"></div>
      <div id="view-users" class="view"></div>
      <div id="view-settings" class="view"></div>
    </main>
  </section>

  <div id="drawer" class="drawer hidden">
    <div class="drawer-backdrop" data-close></div>
    <aside class="drawer-panel" id="drawer-body"></aside>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-text">
    <div class="card modal-box">
      <p id="modal-text"></p>
      <input id="modal-input" class="hidden" aria-label="Respuesta">
      <select id="modal-select" class="hidden" aria-label="Opción"></select>
      <form id="modal-extra" class="modal-extra hidden" onsubmit="return false"></form>
      <div class="actions">
        <button type="button" id="modal-ok">Aceptar</button>
        <button type="button" class="ghost" id="modal-cancel">Cancelar</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="tip" class="tip hidden" role="tooltip"></div>

  <script src="followup.js"></script>
  <script src="app.js"></script>
</body>
</html>
